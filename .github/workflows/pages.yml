name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Confirm current protected main
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Prepare static site
        run: |
          mkdir -p _site

          for file in \
            .nojekyll \
            index.html \
            autobedrijven-ai-voorstel.html \
            autopilots-crm-landing-embed.html \
            plan-je-onboarding-page
          do
            if [ -f "$file" ]; then
              cp "$file" "_site/$file"
            fi
          done

          for dir in \
            agent-service-pages \
            crm-landing-page \
            ghl-autopilots-dashboard \
            home-landing-page \
            leadsmachine-ai-landing-page \
            niche-landing-pages \
            projecten \
            shared-sections \
            splandid-demo \
            vastgoedbeheer-landing-page \
            voice-agent-bedankt-pagina \
            voorstellen
          do
            if [ -d "$dir" ]; then
              mkdir -p "_site/$dir"
              rsync -a --delete \
                --exclude='.DS_Store' \
                --exclude='snapshots' \
                "$dir/" "_site/$dir/"
            fi
          done

          touch _site/.nojekyll
          find _site -name '.DS_Store' -delete

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
