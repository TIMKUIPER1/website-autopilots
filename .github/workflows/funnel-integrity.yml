name: Production funnel integrity

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  protect:
    name: Protect production funnel
    runs-on: ubuntu-latest
    steps:
      - name: Validate funnel against trusted main contract
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require("crypto");
            const contractPath =
              "autopilots-website/config/autodealer-funnel-lock.json";
            const guardrailPaths = new Set([
              ".github/workflows/funnel-integrity.yml",
              ".github/workflows/website-quality.yml",
              contractPath,
              "autopilots-website/scripts/check-ad-funnel-release.mjs",
              "autopilots-website/config/production-release-manifest.json",
            ]);

            const changedFiles = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              },
            );
            const changedPaths = new Set(changedFiles.map((file) => file.filename));

            const readRepositoryFile = async (path, ref) => {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref,
              });
              if (Array.isArray(response.data) || response.data.type !== "file") {
                throw new Error(`${path} is geen bestand`);
              }
              return Buffer.from(response.data.content, "base64");
            };

            // This contract is intentionally read from the protected base commit,
            // never from the pull request. A PR therefore cannot weaken its own gate.
            const baseSha = context.payload.pull_request.base.sha;
            const headSha = context.payload.pull_request.head.sha;
            const contractBuffer = await readRepositoryFile(contractPath, baseSha);
            const contract = JSON.parse(contractBuffer.toString("utf8"));
            const protectedPaths = Object.keys(contract.sha256);
            const funnelChanged = protectedPaths.some((path) => changedPaths.has(path));
            const guardrailChanged = [...guardrailPaths].some((path) =>
              changedPaths.has(path),
            );

            if (funnelChanged && guardrailChanged) {
              core.setFailed(
                "Een PR mag de productiefunnel en de bewaking daarvan nooit tegelijk wijzigen.",
              );
              return;
            }

            if (guardrailChanged) {
              const labels = context.payload.pull_request.labels.map(
                (label) => label.name,
              );
              if (!labels.includes("funnel-contract-change")) {
                core.setFailed(
                  "Wijzigingen aan de funnelbewaking vereisen de expliciete label funnel-contract-change.",
                );
                return;
              }
            }

            if (!funnelChanged) {
              core.info("De vergrendelde productiefunnel is niet gewijzigd.");
              return;
            }

            for (const path of protectedPaths) {
              let content;
              try {
                content = await readRepositoryFile(path, headSha);
              } catch (error) {
                core.setFailed(`Vergrendeld funnelbestand ontbreekt: ${path}`);
                return;
              }
              const actual = crypto.createHash("sha256").update(content).digest("hex");
              const expected = contract.sha256[path];
              if (actual !== expected) {
                core.setFailed(
                  `Productiefunnel geblokkeerd: ${path} wijkt af van contract ${contract.releaseId}.`,
                );
                return;
              }
            }

            core.info(
              `Productiefunnel is byte-voor-byte gelijk aan contract ${contract.releaseId}.`,
            );
