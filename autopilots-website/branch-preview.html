<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Voor wie | Autopilots</title>
  <style>
    :root {
      --ap-bg: #f5f5f2;
      --ap-card: #ffffff;
      --ap-text: #111111;
      --ap-muted: #656565;
      --ap-line: rgba(0, 0, 0, 0.1);
      --ap-brown: #9f3826;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--ap-bg);
      color: var(--ap-text);
      font-family: "Public Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(92vw, 760px);
      padding: 56px;
      border: 1px solid var(--ap-line);
      border-radius: 32px;
      background: var(--ap-card);
      box-shadow: 0 26px 80px rgba(17, 17, 17, 0.08);
    }

    .eyebrow {
      margin: 0 0 16px;
      color: var(--ap-brown);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 620px;
      margin: 0;
      font-size: clamp(40px, 7vw, 76px);
      line-height: 0.96;
      letter-spacing: -0.02em;
    }

    p {
      max-width: 560px;
      margin: 24px 0 0;
      color: var(--ap-muted);
      font-size: 20px;
      font-weight: 750;
      line-height: 1.55;
    }

    a {
      display: inline-flex;
      margin-top: 32px;
      padding: 18px 28px;
      border-radius: 999px;
      background: var(--ap-brown);
      color: #fff;
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 18px 40px rgba(159, 56, 38, 0.2);
    }

    @media (max-width: 640px) {
      main {
        padding: 34px 24px;
        border-radius: 24px;
      }

      p {
        font-size: 17px;
      }
    }
  </style>
  <script>
    const params = new URLSearchParams(window.location.search);
    const requested = params.get("branche") || "autobedrijven";
    const aliases = {
      dierenartsen: "dierenarts",
      vastgoedbeheer: "vastgoedbeheerders"
    };
    const allowed = new Set([
      "autobedrijven",
      "cosmetische-klinieken",
      "dakdekkers",
      "dierenarts",
      "dierenverzorging",
      "evenementen",
      "glaszetters",
      "hotels",
      "hoveniers",
      "installatietechniek",
      "kapperszaken",
      "kozijnen",
      "makelaars",
      "non-profit",
      "restaurants",
      "tandartsen",
      "vastgoedbeheerders",
      "verzekeraars",
      "vloerenleggers",
      "woningcorporaties",
      "zonnepanelen"
    ]);
    const slug = aliases[requested] || requested;
    const target = `voor-wie/${allowed.has(slug) ? slug : "autobedrijven"}/`;
    window.location.replace(target);
  </script>
</head>
<body>
  <main>
    <p class="eyebrow">Nieuwe Voor wie-route</p>
    <h1>Deze pagina is verhuisd naar de voorstelpagina.</h1>
    <p>Je wordt automatisch doorgestuurd naar de nieuwe Autopilots landingspagina per niche.</p>
    <a href="voor-wie/autobedrijven/">Bekijk voorstelpagina</a>
  </main>
</body>
</html>
