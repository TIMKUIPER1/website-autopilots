<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Autopilots Demo</title>
    <link rel="stylesheet" href="/app.css?v=20260721-hud12">
    <link rel="stylesheet" href="/workspace.css?v=20260721-hud12">
  </head>
  <body>
    <div id="workspaceApp" class="shell">
      <aside class="sidebar">
        <a class="brand ap-brand" href="/" aria-label="Autopilots home">AUTOPILOTS</a>
        <div class="workspace">
          <small id="spaceLabel">WERKOMGEVING</small>
          <strong id="spaceName">Curaçao Auto Center</strong>
        </div>
        <nav class="nav" id="appNav"></nav>
        <div class="sidebar-footer">
          <button class="reset-link" data-action="reset">Reset veilige demo</button>
          <br>
          Autopilots © 2026
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="status">Veilige demo actief</div>
          <div class="top-actions">
            <button type="button" class="text-link top-link-button" data-action="logout">Uitloggen</button>
            <div class="avatar">TC</div>
          </div>
        </header>
        <div class="notice">Demomodus — geen echte calls, betalingen, e-mails of externe systeemwijzigingen.</div>
        <div id="view">
          <div class="loading-card">
            <img src="/ap-logo.svg" alt="">
            <strong>Demo wordt klaargezet…</strong>
          </div>
        </div>
      </main>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/workspace.js?v=20260721-hud12"></script>
  </body>
</html>
